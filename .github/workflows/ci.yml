# Lint and build on every push to main and every pull request. The editor/Chrome checks in bench/ need the offline
# Entry editor and a browser, so they stay local.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # dist/ and the release zip: the extension package must still build
      - run: pnpm release
