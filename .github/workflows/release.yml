# Push a tag v<release version> (manifest.json, see scripts/version.js): GitHub builds the zip and its SHA-256, attests
# where they came from, and attaches them to a DRAFT release. Write the notes, then publish it; the popup's update check
# only sees published releases. A release candidate tag (v0.3.0-rc.1) makes a pre-release, which only candidates are
# told about.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - name: The tag matches manifest.json
        run: test "v$(node scripts/version.js)" = "$GITHUB_REF_NAME"
      - run: pnpm release
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: release/*.zip
      - name: Draft release with the zip and its hash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          kind=()
          if [[ "$GITHUB_REF_NAME" == *-rc.* ]]; then kind=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" release/*.zip release/*.sha256 --draft "${kind[@]}" --title "$GITHUB_REF_NAME" --generate-notes
