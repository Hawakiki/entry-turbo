<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>엔트리 터보</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <h1>엔트리 터보 <span class="tag">실험</span> <span id="version" class="tag"></span></h1>
    <p id="update" class="update" hidden></p>

    <section class="switches">
      <label><input type="checkbox" id="enabled" /> 켜기</label>
      <label class="sub"><input type="checkbox" id="compile" /> 블록을 JS로 컴파일</label>
      <label class="sub"><input type="checkbox" id="deferViews" /> 변수 표시 갱신 모으기</label>
      <p class="note">실행 중에 바꾸면 멈춘 뒤 다음 실행부터 적용됩니다.</p>
    </section>

    <section class="switches">
      <label><input type="checkbox" id="osd" /> 속도계(OSD) 표시</label>
      <p class="note">무대 왼쪽 위에 FPS·틱·스크립트 시간·그래프를 띄웁니다. 켜고 끄기는 바로 적용.</p>
    </section>

    <section id="status">
      <p class="muted">이 탭을 확인하는 중…</p>
    </section>

    <script src="popup.js"></script>
  </body>
</html>
